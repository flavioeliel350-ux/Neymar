<!DOCTYPE html>

<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><title>ProntoPreço</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

 "0.5rem", "gutter-mobile": "0.75rem" }, "fontFamily": { "headline-lg": ["Inter"], "headline-sm": ["Inter"], "body-md": ["Inter"], "display-price": ["Inter"], "label-lg": ["Inter"], "body-lg": ["Inter"], "display-price-mobile": ["Inter"], "body-sm": ["Inter"], "label-sm": ["Inter"], "label-code": ["Inter"], "headline-md": ["Inter"] }, "fontSize": { "headline-lg": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "headline-sm": ["16px", { "lineHeight": "22px", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "display-price": ["40px", { "lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "900" }], "label-lg": ["14px", { "lineHeight": "18px", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "display-price-mobile": ["34px", { "lineHeight": "38px", "letterSpacing": "-0.025em", "fontWeight": "900" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "700" }], "label-code": ["13px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.015em", "fontWeight": "700" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#faf8ff;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);

  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="flex flex-col h-20 px-margin-mobile justify-between py-space-xs"><div class="flex items-center justify-between h-5 text-on-surface-variant font-label-sm text-label-sm"><span class="font-label-sm font-bold tracking-tight text-on-surface">09:41</span><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[14px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[14px]">wifi</span><span class="material-symbols-outlined text-[14px]">battery_full</span></div></div><div class="flex items-center justify-between pb-space-xs"><div class="flex items-center gap-space-xs"><button aria-label="Voltar" class="w-11 h-11 flex items-center justify-center text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button><div class="flex flex-col"><h1 class="font-headline-sm text-headline-sm text-on-surface line-clamp-1">Ajuste De Preco</h1><div class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-secondary"></span><span class="font-label-sm text-[10px] text-on-surface-variant uppercase">Modo Offline Ativo</span></div></div></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-20 pb-safe bg-surface min-h-screen px-margin-mobile"><div class="flex flex-col w-full pb-6 space-y-space-md">
<!-- Status Notification Banner -->
<div class="flex items-start gap-space-sm p-space-md bg-secondary-container/30 text-on-surface rounded-xl shadow-sm transition-all">
<div class="w-8 h-8 rounded-full bg-secondary text-on-secondary flex items-center justify-center shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[18px]">barcode_scanner</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-secondary font-bold">Código escaneado com sucesso!</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Preencha os dados essenciais e salve offline para sincronizar depois.</span>
</div>
</div>
<!-- Form Wrapper -->
<form class="flex flex-col space-y-space-md" id="productForm" onsubmit="event.preventDefault(); handleSaveProduct();">
<!-- Field 1: Barcode EAN (Readonly / Locked) -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider flex items-center justify-between">
<span>Código de Barras (EAN-13)</span>
<span class="text-tertiary font-bold flex items-center gap-0.5 text-[10px]">
<span class="material-symbols-outlined text-[12px]">lock</span> Travado
        </span>
</label>
<div class="flex items-center h-12 px-space-md bg-surface-container-high rounded-lg text-on-surface select-none">
<span class="material-symbols-outlined text-outline text-[20px] mr-space-sm">lock</span>
<input class="bg-transparent w-full font-label-code text-label-code text-on-surface font-bold tracking-wider outline-none cursor-default" id="barcodeInput" readonly="" tabindex="-1" type="text" value="7891000100103"/>
<span class="material-symbols-outlined text-secondary text-[20px]" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
<!-- Field 2: Product Name (Primary Input) -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface font-bold" for="productName">
        Nome do Produto <span class="text-error font-bold">*</span>
</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-lg shadow-sm">
<input class="w-full h-13 px-space-md pr-11 bg-transparent font-body-lg text-body-lg text-on-surface rounded-lg outline-none focus:ring-2 focus:ring-primary/20 transition-all font-semibold" id="productName" name="productName" placeholder="Ex: Arroz Tipo 1 5kg" required="" type="text" value="Café Torrado e Moído Pilão 500g"/>
<button aria-label="Limpar nome" class="absolute right-2 w-8 h-8 rounded-full flex items-center justify-center text-outline hover:text-on-surface hover:bg-surface-container transition-colors" id="clearNameBtn" onclick="clearProductName()" type="button">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
</div>
<!-- Field 3: Selling Price (Highlight) -->
<div class="flex flex-col p-space-md bg-surface-container-lowest rounded-xl shadow-sm space-y-space-sm">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface font-bold uppercase tracking-wider" for="priceInput">
          Preço de Venda <span class="text-error">*</span>
</label>
<span class="bg-secondary-container/40 text-on-secondary-container font-label-sm text-label-sm px-2 py-0.5 rounded-full font-bold">
          Margem Padrão
        </span>
</div>
<!-- Large Monetary Input -->
<div class="flex items-baseline bg-surface-container-low px-space-md py-space-sm rounded-lg">
<span class="font-headline-md text-headline-md text-secondary font-extrabold mr-1.5 select-none">R$</span>
<input class="w-full bg-transparent font-display-price-mobile text-display-price-mobile text-secondary font-black outline-none tracking-tight" id="priceInput" inputmode="decimal" required="" type="text" value="19,80"/>
</div>
<!-- Quick Price Micro-actions -->
<div class="grid grid-cols-3 gap-space-xs pt-space-xs">
<button class="flex items-center justify-center py-2 px-1 bg-surface-container hover:bg-surface-variant active:scale-95 text-on-surface rounded-lg font-label-sm text-label-sm transition-transform font-bold" onclick="adjustPrice(0.50)" type="button">
          +R$ 0,50
        </button>
<button class="flex items-center justify-center py-2 px-1 bg-surface-container hover:bg-surface-variant active:scale-95 text-on-surface rounded-lg font-label-sm text-label-sm transition-transform font-bold" onclick="adjustPrice(1.00)" type="button">
          +R$ 1,00
        </button>
<button class="flex items-center justify-center py-2 px-1 bg-primary-fixed hover:bg-primary-fixed-dim active:scale-95 text-on-primary-fixed rounded-lg font-label-sm text-label-sm transition-transform font-bold" onclick="roundToNinetyNine()" type="button">
          Arredondar ,99
        </button>
</div>
</div>
<!-- Field 4: Category / Section (Fast Chips) -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant font-bold uppercase tracking-wider">
        Seção / Categoria
      </label>
<input id="selectedCategory" name="category" type="hidden" value="Mercearia"/>
<div class="flex flex-wrap gap-space-xs" id="categoryChips">
<button class="category-chip px-3.5 py-2 rounded-full font-label-sm text-label-sm font-bold transition-all bg-primary text-on-primary shadow-sm" data-category="Mercearia" onclick="selectCategory(this, 'Mercearia')" type="button">
          Mercearia
        </button>
<button class="category-chip px-3.5 py-2 rounded-full font-label-sm text-label-sm font-bold transition-all bg-surface-container text-on-surface-variant active:scale-95" data-category="Bebidas" onclick="selectCategory(this, 'Bebidas')" type="button">
          Bebidas
        </button>
<button class="category-chip px-3.5 py-2 rounded-full font-label-sm text-label-sm font-bold transition-all bg-surface-container text-on-surface-variant active:scale-95" data-category="Limpeza" onclick="selectCategory(this, 'Limpeza')" type="button">
          Limpeza
        </button>
<button class="category-chip px-3.5 py-2 rounded-full font-label-sm text-label-sm font-bold transition-all bg-surface-container text-on-surface-variant active:scale-95" data-category="Frios" onclick="selectCategory(this, 'Frios')" type="button">
          Frios
        </button>
<button class="category-chip px-3.5 py-2 rounded-full font-label-sm text-label-sm font-bold transition-all bg-surface-container text-on-surface-variant active:scale-95" data-category="Outros" onclick="selectCategory(this, 'Outros')" type="button">
          Outros
        </button>
</div>
</div>
<!-- Field 5: Location / Observation -->
<div class="flex flex-col space-y-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant font-bold uppercase tracking-wider" for="locationInput">
          Localização no Estoque / Salão
        </label>
<span class="font-label-sm text-label-sm text-outline">Opcional</span>
</div>
<div class="flex items-center bg-surface-container-lowest px-space-md py-space-xs rounded-lg shadow-sm">
<span class="material-symbols-outlined text-outline text-[20px] mr-space-sm">storefront</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface py-2 outline-none font-medium" id="locationInput" name="location" placeholder="Ex: Corredor 4, Prateleira 3" type="text" value="Gôndola 02 - Prateleira B"/>
</div>
</div>
<!-- Sticky Bottom CTAs Block -->
<div class="pt-space-md flex flex-col space-y-space-sm">
<button class="w-full h-14 bg-secondary text-on-secondary rounded-lg font-label-lg text-label-lg uppercase tracking-wide flex items-center justify-center gap-space-sm shadow-md active:opacity-90 active:scale-[0.99] transition-all" id="saveBtn" type="submit">
<span class="material-symbols-outlined text-[24px]" id="saveIcon">cloud_sync</span>
<span id="saveText">Salvar Produto no Banco Local</span>
</button>
<button class="w-full py-2.5 text-center font-label-sm text-label-sm text-on-surface-variant hover:text-error transition-colors flex items-center justify-center gap-1 font-semibold" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[16px]">close</span>
        Cancelar e voltar ao Scanner
      </button>
</div>
</form>
<!-- Interactive Feedback Logic -->
<script>
    function clearProductName() {
      const input = document.getElementById('productName');
      input.value = '';
      input.focus();
    }

    function parsePrice(val) {
      if (!val) return 0;
      const clean = val.replace(/\./g, '').replace(',', '.');
      return parseFloat(clean) || 0;
    }

    function formatPrice(val) {
      return val.toFixed(2).replace('.', ',');
    }

    function adjustPrice(amount) {
      const priceInput = document.getElementById('priceInput');
      let current = parsePrice(priceInput.value);
      current = Math.max(0, current + amount);
      priceInput.value = formatPrice(current);
      triggerPricePulse();
    }

    function roundToNinetyNine() {
      const priceInput = document.getElementById('priceInput');
      let current = parsePrice(priceInput.value);
      const floorInt = Math.floor(current);
      priceInput.value = formatPrice(floorInt + 0.99);
      triggerPricePulse();
    }

    function triggerPricePulse() {
      const priceInput = document.getElementById('priceInput');
      priceInput.classList.add('scale-105', 'text-tertiary-container');
      setTimeout(() => {
        priceInput.classList.remove('scale-105', 'text-tertiary-container');
      }, 150);
    }

    function selectCategory(buttonElement, catName) {
      document.getElementById('selectedCategory').value = catName;
      const chips = document.querySelectorAll('.category-chip');
      chips.forEach(chip => {
        chip.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
        chip.classList.add('bg-surface-container', 'text-on-surface-variant');
      });
      buttonElement.classList.remove('bg-surface-container', 'text-on-surface-variant');
      buttonElement.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
    }

    function handleSaveProduct() {
      const btn = document.getElementById('saveBtn');
      const icon = document.getElementById('saveIcon');
      const text = document.getElementById('saveText');

      // Visual feedback
      btn.disabled = true;
      btn.classList.remove('bg-secondary');
      btn.classList.add('bg-tertiary-container');
      icon.innerText = 'check_circle';
      icon.style.fontVariationSettings = "'FILL' 1";
      text.innerText = 'PRODUTO GRAVADO OFFLINE!';

      setTimeout(() => {
        btn.classList.remove('bg-tertiary-container');
        btn.classList.add('bg-secondary');
        icon.innerText = 'cloud_sync';
        icon.style.fontVariationSettings = "'FILL' 0";
        text.innerText = 'Salvar Produto no Banco Local';
        btn.disabled = false;
      }, 2000);
    }
  </script>
</div></main></body></html>
