name: Compilar Windows .exe (ProntoPreço)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build ProntoPreço Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências do app web
        run: npm install --legacy-peer-deps

      - name: Compilar bundle web (Vite) com repositório GitHub vinculado
        env:
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_GITHUB_BRANCH: ${{ github.ref_name }}
        run: npm run build

      - name: Copiar bundle compilado para desktop/dist
        run: node -e "const fs = require('fs'); fs.rmSync('desktop/dist', { recursive: true, force: true }); fs.cpSync('dist', 'desktop/dist', { recursive: true });"

      - name: Instalar dependências do Electron
        working-directory: desktop
        run: npm install

      - name: Compilar executáveis Windows (.exe)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Publicar arquivos .exe para download
        uses: actions/upload-artifact@v4
        with:
          name: ProntoPreco-Windows-EXE
          path: |
            desktop/release/ProntoPreco-Instalador-Windows.exe
            desktop/release/ProntoPreco-Portatil-Windows.exe
          if-no-files-found: error
          retention-days: 30

      - name: Anexar .exe à Release do GitHub (quando houver tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/ProntoPreco-Instalador-Windows.exe
            desktop/release/ProntoPreco-Portatil-Windows.exe
          generate_release_notes: true
