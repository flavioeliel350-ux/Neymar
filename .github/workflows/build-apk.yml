name: Compilar APK Android (ProntoPreço)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build ProntoPreço APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Android SDK 36 e aceitar licenças
        run: |
          SDK_BIN="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_BIN" ]; then
            SDK_BIN="$(command -v sdkmanager)"
          fi
          yes | "$SDK_BIN" --licenses > /dev/null 2>&1 || true
          "$SDK_BIN" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Preservar assinatura debug consistente para atualizações no app
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prontopreco-android-debug-keystore-v1

      - name: Garantir keystore persistente para atualização sem conflito de assinatura
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ProntoPreco,O=ProntoPreco,C=BR"
          fi

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências npm
        run: npm install --legacy-peer-deps

      - name: Compilar bundle web (Vite) com repositório GitHub vinculado
        env:
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_GITHUB_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar APK com nome padrão
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ProntoPreco-Android.apk

      - name: Publicar APK para download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ProntoPreco-Android-APK
          path: ProntoPreco-Android.apk
          if-no-files-found: error
          retention-days: 30
