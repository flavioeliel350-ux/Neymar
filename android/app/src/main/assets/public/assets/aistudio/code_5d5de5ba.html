## 1. Stack Tecnológica Recomendada

Para um app focado em velocidade operacional, alto desempenho offline e leitura rápida de câmera com código de barras, a stack recomendada é **React Native com Expo (bare/prebuild pronto ou Expo SDK 51+) com TypeScript**:

1. **Framework:** `React Native + Expo (SDK 51+)`
   - *Por quê:* Rápido setup, suporte multiplataforma (Android/iOS) unificado, excelente ecossistema para prototipação e deploy em pequenos comércios.
2. **Scanner de Código de Barras:** `expo-camera` (`useCameraPermissions`, `CameraView` com `barcodeScannerSettings`) ou `react-native-vision-camera` + `vision-camera-code-scanner` (ML Kit).
   - *Por quê:* O componente nativo `CameraView` do Expo moderno possui suporte nativo a hardware acceleration para decodificação instantânea de EAN-13, EAN-8, Code 128, UPC-A a 60fps sem engasgos.
3. **Banco de Dados Local:** `expo-sqlite` (ou `WatermelonDB` / `op-sqlite`).
   - *Por quê:* O `expo-sqlite` oferece suporte a SQLite nativo com queries síncronas/assíncronas extremamente rápidas, transações ACID confiáveis e funcionamento 100% offline sem depender de conexão de rede.
4. **Gerenciamento de Estado & UI:** `Zustand` (leveza extrema) + `Tailwind (NativeWind v4)` ou StyleSheet puro para máximo desempenho de renderização.

### B. Inicialização e Repositório SQLite (`src/database/productRepository.ts`)
```typescript
import * as SQLite from 'expo-sqlite';
import { Product } from '../types/product';

let db: SQLite.SQLiteDatabase | null = null;

export async function getDatabase(): Promise<SQLite.SQLiteDatabase> {
  if (!db) {
    db = await SQLite.openDatabaseAsync('store_products.db');
    await db.execAsync(`
      PRAGMA journal_mode = WAL;
      CREATE TABLE IF NOT EXISTS products (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        barcode TEXT UNIQUE NOT NULL,
        name TEXT NOT NULL,
        price REAL NOT NULL,
        description TEXT,
        photo_uri TEXT,
        updated_at TEXT NOT NULL
      );
      CREATE INDEX IF NOT EXISTS idx_barcode ON products(barcode);
    `);
  }
  return db;
}

export async function findProductByBarcode(barcode: string): Promise<Product | null> {
  const database = await getDatabase();
  const row = await database.getFirstAsync<any>(
    'SELECT * FROM products WHERE barcode = ?',
    [barcode]
  );
  if (!row) return null;
  return {
    id: row.id,
    barcode: row.barcode,
    name: row.name,
    price: row.price,
    description: row.description,
    photoUri: row.photo_uri,
    updatedAt: row.updated_at,
  };
}

export async function upsertProduct(product: Omit<Product, 'id' | 'updatedAt'>): Promise<void> {
  const database = await getDatabase();
  const now = new Date().toISOString();
  await database.runAsync(
    `INSERT INTO products (barcode, name, price, description, photo_uri, updated_at)
     VALUES (?, ?, ?, ?, ?, ?)
     ON CONFLICT(barcode) DO UPDATE SET
       name = excluded.name,
       price = excluded.price,
       description = excluded.description,
       photo_uri = excluded.photo_uri,
       updated_at = excluded.updated_at;`,
    [product.barcode, product.name, product.price, product.description || '', product.photoUri || '', now]
  );
}
```

### D. Tela do Leitor / Câmera (`src/screens/ScannerScreen.tsx`)
```typescript
import React, { useState } from 'react';
import { StyleSheet, Text, View, TouchableOpacity, Alert } from 'react-native';
import { CameraView, useCameraPermissions } from 'expo-camera';
import { findProductByBarcode } from '../database/productRepository';

export function ScannerScreen({ route, navigation }: any) {
  const { mode } = route.params; // 'query' | 'register'
  const [permission, requestPermission] = useCameraPermissions();
  const [scanned, setScanned] = useState(false);

  if (!permission) return <View style={styles.center}><Text>Carregando permissões...</Text></View>;
  if (!permission.granted) {
    return (
      <View style={styles.center}>
        <Text style={styles.alertText}>Precisamos de acesso à câmera para ler os códigos.</Text>
        <TouchableOpacity style={styles.btnAction} onPress={requestPermission}>
          <Text style={styles.btnActionText}>Permitir Acesso</Text>
        </TouchableOpacity>
      </View>
    );
  }

  const handleBarcodeScanned = async ({ data }: { data: string }) => {
    if (scanned) return;
    setScanned(true);

    try {
      const existingProduct = await findProductByBarcode(data);

      if (mode === 'query') {
        if (existingProduct) {
          navigation.replace('PriceCheck', { product: existingProduct });
        } else {
          Alert.alert(
            'Não Encontrado',
            `Código: ${data}\nEste produto não está cadastrado.`,
            [
              { text: 'Escanear Outro', onPress: () => setScanned(false) },
              {
                text: 'Cadastrar Agora',
                style: 'default',
                onPress: () => navigation.replace('ProductForm', { barcode: data }),
              },
            ]
          );
        }
      } else {
        // mode === 'register'
        navigation.replace('ProductForm', {
          barcode: data,
          product: existingProduct || null,
        });
      }
    } catch (e) {
      Alert.alert('Erro', 'Falha ao buscar produto.');
      setScanned(false);
    }
  };

  return (
    <View style={styles.container}>
      <CameraView
        style={StyleSheet.absoluteFillObject}
        barcodeScannerSettings={{
          barcodeTypes: ['ean13', 'ean8', 'upc_a', 'code128', 'qr'],
        }}
        onBarcodeScanned={scanned ? undefined : handleBarcodeScanned}
      />
      <View style={styles.overlay}>
        <View style={styles.scanTargetBox} />
        <Text style={styles.scanPrompt}>
          {mode === 'query' ? 'Posicione o código para consultar preço' : 'Posicione o código para cadastrar/editar'}
        </Text>
      </View>
    </View>
  );
}

const styles = StyleSheet.create({
  container: { flex: 1, backgroundColor: '#000' },
  center: { flex: 1, justifyContent: 'center', alignItems: 'center', padding: 20 },
  alertText: { fontSize: 16, textAlign: 'center', marginBottom: 16, color: '#334155' },
  btnAction: { backgroundColor: '#2563EB', paddingHorizontal: 24, paddingVertical: 12, borderRadius: 10 },
  btnActionText: { color: '#FFF', fontWeight: 'bold' },

### F. Tela de Cadastro / Edição (`src/screens/ProductFormScreen.tsx`)
```typescript
import React, { useState } from 'react';
import { View, Text, TextInput, TouchableOpacity, StyleSheet, Alert, SafeAreaView, KeyboardAvoidingView, Platform, ScrollView } from 'react-native';
import { upsertProduct } from '../database/productRepository';

export function ProductFormScreen({ route, navigation }: any) {
  const { barcode, product } = route.params;

  const [name, setName] = useState(product?.name || '');
  const [price, setPrice] = useState(product ? String(product.price) : '');
  const [description, setDescription] = useState(product?.description || '');
  const [saving, setSaving] = useState(false);

  const handleSave = async () => {
    if (!name.trim()) {
      Alert.alert('Atenção', 'Informe o nome do produto.');
      return;
    }
    const parsedPrice = parseFloat(price.replace(',', '.'));
    if (isNaN(parsedPrice) || parsedPrice < 0) {
      Alert.alert('Atenção', 'Informe um preço válido.');
      return;
    }

    try {
      setSaving(true);
      await upsertProduct({
        barcode,
        name: name.trim(),
        price: parsedPrice,
        description: description.trim(),
      });
      Alert.alert('Sucesso', 'Produto salvo com sucesso!', [
        {
          text: 'Continuar Bipando',
          onPress: () => navigation.replace('Scanner', { mode: 'register' }),
        },
        {
          text: 'Início',
          onPress: () => navigation.navigate('Home'),
        },
      ]);
    } catch (err) {
      Alert.alert('Erro', 'Não foi possível salvar o produto.');
    } finally {
      setSaving(false);
    }
  };

  return (
    <SafeAreaView style={styles.container}>
      <KeyboardAvoidingView behavior={Platform.OS === 'ios' ? 'padding' : undefined} style={{ flex: 1 }}>
        <ScrollView contentContainerStyle={styles.scroll}>
          <Text style={styles.headerTitle}>{product ? 'Editar Produto' : 'Novo Produto'}</Text>
          
          <View style={styles.fieldGroup}>
            <Text style={styles.label}>Código de Barras (Travado)</Text>
            <TextInput style={[styles.input, styles.disabledInput]} value={barcode} editable={false} />
          </View>

          <View style={styles.fieldGroup}>
            <Text style={styles.label}>Nome do Produto *</Text>
            <TextInput
              style={styles.input}
              placeholder="Ex: Arroz Tio João 5kg"
              value={name}
              onChangeText={setName}
            />
          </View>

          <View style={styles.fieldGroup}>
            <Text style={styles.label}>Preço de Venda (R$) *</Text>
            <TextInput
              style={[styles.input, styles.priceInput]}
              placeholder="0,00"
              keyboardType="decimal-pad"
              value={price}
              onChangeText={setPrice}
            />
          </View>

          <View style={styles.fieldGroup}>
            <Text style={styles.label}>Observação / Descrição (Opcional)</Text>
            <TextInput
              style={[styles.input, styles.textArea]}
              placeholder="Ex: Prateleira B3, lote 12..."
              value={description}
              onChangeText={setDescription}
              multiline
              numberOfLines={3}
            />
          </View>

          <TouchableOpacity
            style={[styles.saveBtn, saving && { opacity: 0.7 }]}
            onPress={handleSave}
            disabled={saving}
          >
            <Text style={styles.saveBtnText}>{saving ? 'Salvando...' : 'SALVAR PRODUTO'}</Text>
          </TouchableOpacity>
        </ScrollView>
      </KeyboardAvoidingView>
    </SafeAreaView>
  );
}

const styles = StyleSheet.create({

  scroll: { padding: 24, gap: 16 },

   ```json
   {
     "expo": {
       "plugins": [
         [

           {
             "cameraPermission": "O app precisa de acesso à câmera para escanear os códigos de barras dos produtos."

         ]

3. **Execução no Dispositivo Físico (Recomendado para testar Câmera):**
